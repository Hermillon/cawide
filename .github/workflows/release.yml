name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release Tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Verify tag version matches Cargo.toml
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[]|select(.name=="cawide-host").version')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Release tag matches Cargo.toml version: $TAG_VERSION"

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            native: true
          - target: x86_64-apple-darwin
            os: macos-15
            native: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            native: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            native: true
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            native: true
          - target: aarch64-pc-windows-msvc
            os: windows-2022
            native: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build cawide-host binary
        env:
          CAWIDE_GITHUB_OAUTH_CLIENT_ID: ${{ vars.CAWIDE_GITHUB_OAUTH_CLIENT_ID }}
          CAWIDE_GITLAB_OAUTH_CLIENT_ID: ${{ vars.CAWIDE_GITLAB_OAUTH_CLIENT_ID }}
        run: cargo build -p cawide-host --release --locked --target ${{ matrix.target }}

      - name: Smoke test binary
        if: matrix.native
        shell: bash
        run: |
          EXE_PATH="target/${{ matrix.target }}/release/cawide"
          if [ -f "${EXE_PATH}.exe" ]; then
            EXE_PATH="${EXE_PATH}.exe"
          fi
          VERSION_OUTPUT=$("$EXE_PATH" --version)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION_OUTPUT"
          echo "$VERSION_OUTPUT" | grep -F "$TAG_VERSION"

      - name: Package archives (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/cawide"
          ARCHIVE="dist/cawide-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$BIN")" cawide
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "cawide-${{ matrix.target }}.tar.gz" > "cawide-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "cawide-${{ matrix.target }}.tar.gz" > "cawide-${{ matrix.target }}.tar.gz.sha256"
          fi

      - name: Package archives (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/cawide.exe"
          TAR_ARCHIVE="dist/cawide-${{ matrix.target }}.tar.gz"
          ZIP_ARCHIVE="dist/cawide-${{ matrix.target }}.zip"
          tar -czf "$TAR_ARCHIVE" -C "$(dirname "$BIN")" cawide.exe
          powershell -Command "Compress-Archive -Path 'target/${{ matrix.target }}/release/cawide.exe' -DestinationPath '$ZIP_ARCHIVE' -Force"
          cd dist
          sha256sum "cawide-${{ matrix.target }}.tar.gz" > "cawide-${{ matrix.target }}.tar.gz.sha256"
          sha256sum "cawide-${{ matrix.target }}.zip" > "cawide-${{ matrix.target }}.zip.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.2.3
        with:
          subject-path: |
            dist/cawide-${{ matrix.target }}.tar.gz
            dist/cawide-${{ matrix.target }}*.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.1
        with:
          name: cawide-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v2.2.1
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256

  npm-publish:
    name: Publish to npm
    needs: github-release
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/package-npm.js --version "$GITHUB_REF_NAME" --artifacts artifacts --publish
