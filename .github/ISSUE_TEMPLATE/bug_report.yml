name: Bug Report
description: File a bug report for the Cawide host CLI
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below.
  - type: input
    id: version
    attributes:
      label: Cawide Version
      description: Run `cawide --version` and paste the output.
      placeholder: "cawide 0.13.0"
    validations:
      required: true
  - type: input
    id: os-arch
    attributes:
      label: Operating System & Architecture
      description: e.g. macOS Sonoma 14.5 (arm64), Ubuntu 24.04 (x86_64), Windows 11 (x64)
      placeholder: "macOS 15.1 (arm64)"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      description: How did you install Cawide?
      options:
        - "npm (npm install -g cawide)"
        - "GitHub release archive"
        - "Built from source"
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Coding Agent
      description: Which coding agent is being used (claude, codex, omp, opencode, aider, etc.)?
      placeholder: "claude"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run `cawide serve --workdir ...`
        2. Connect from mobile client
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Daemon Logs
      description: Output of `cawide logs -n 100`.
      render: shell
    validations:
      required: false
